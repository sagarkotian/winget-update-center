name: Project validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Windows PowerShell validation
        shell: powershell
        run: .\tests\Test-Project.ps1

      - name: Run C# Winget parser tests
        run: dotnet run --project .\tests\WingetUpdateCenter.CoreTests\WingetUpdateCenter.CoreTests.csproj

      - name: Compile Command Palette source
        run: dotnet msbuild .\WingetUpdateCenter.CommandPalette\WingetUpdateCenter.CommandPalette.csproj -restore -t:Compile -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:CsWinRTEnabled=false -p:EnableMsixTooling=false
