name: PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Windows PowerShell validation
        shell: powershell
        run: .\tests\Test-Project.ps1
